services:
  lazer:
    build: .
    image: lazer-dev
    container_name: lazer-dev
    working_dir: /go/src/lazer
    depends_on: 
      - db
    ports:
      - 3500:8080
      - 3600:3600
    volumes:
      - ${PWD}:/go/src/lazer
    env_file:
      - .env
    command: ["/wait-for-it.sh", "db:3306", "--", "air"]

  db:
    image: mysql:9.7
    container_name: lazer-db
    ports:
      - 3336:3306
    volumes:
      - ${PWD}/.persisted/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$DB_PASSWORD
      - MYSQL_DATABASE=$DB_NAME
